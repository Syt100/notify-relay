name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$RUNNER_TEMP/gitleaks.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c gitleaks.sha256)
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .'
      - name: Scan checked-out files
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: go mod verify
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t bridge:test .
      - name: Check hardened container liveness
        run: |
          docker run -d --name bridge --network none --read-only --memory 64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e NTFY_TOKEN=tk_ci -e WXPUSHER_SPT=SPT_ci \
            -v bridge-ci:/data bridge:test
          trap 'docker logs bridge; docker rm -f bridge' EXIT
          for attempt in $(seq 1 20); do
            if docker exec bridge /bridge healthcheck; then
              if docker exec bridge /bridge readycheck; then
                echo 'Disconnected bridge must not be ready'
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Check cross-platform binaries before publishing
        run: |
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            docker build --platform "$platform" -t bridge:cross .
            VERIFY_IMAGE_PULL=false sh scripts/verify-image-platforms.sh bridge:cross "$platform"
          done
  ghcr:
    runs-on: ubuntu-latest
    needs: [secrets, test, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,format=long
          flavor: latest=false
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=main-${{ github.sha }}
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,mode=max,scope=ghcr,ignore-error=true
          provenance: true
          sbom: true
      - name: Verify published platforms
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$image@$DIGEST" --raw > "$RUNNER_TEMP/ghcr-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") |
            .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)] |
            sort == ["linux/amd64", "linux/arm/v7", "linux/arm64"]' "$RUNNER_TEMP/ghcr-manifest.json"
      - name: Verify each platform's binary
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: sh scripts/verify-image-platforms.sh "ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "Published \`$image:main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned image: \`$image@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
