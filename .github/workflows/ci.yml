name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$RUNNER_TEMP/gitleaks.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c gitleaks.sha256)
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .'
      - name: Scan checked-out files
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .'
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: go mod verify
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bridge:test .
      - name: Check hardened container liveness
        run: |
          docker run -d --name bridge --network none --read-only --memory 64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e NTFY_TOKEN=tk_ci -e WXPUSHER_SPT=SPT_ci \
            -v bridge-ci:/data bridge:test
          trap 'docker logs bridge; docker rm -f bridge' EXIT
          for attempt in $(seq 1 20); do
            if docker exec bridge /bridge healthcheck; then
              if docker exec bridge /bridge readycheck; then
                echo 'Disconnected bridge must not be ready'
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          exit 1
